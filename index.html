<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hesap Takip Paneli</title>
    <style>
        :root {
            --bg-color: #eef2f3;
            --panel-bg: #ffffff;
            --text-color: #111111;
            --accent-color: #5c67f2;
            --accent-hover: #3842bc;
            --border-color: #ddd;
            --box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* --- ÖZEL GÜN TEMALARI --- */
        body.theme-yilbasi {
            --bg-color: #0b1d3a;
            --panel-bg: #132746;
            --text-color: #f1f5f9;
            --accent-color: #e74c3c;
            --accent-hover: #c0392b;
            --border-color: #2c4a75;
            --box-shadow: 0 4px 20px rgba(231, 76, 60, 0.25);
        }
        body.theme-yilbasi .mesaj-kutusu { background: #19345e; color: #fff; border-left-color: #27ae60; }
        body.theme-yilbasi input, body.theme-yilbasi select { background: #0b1d3a; color: #fff; border-color: #2c4a75; }

        body.theme-cadilar {
            --bg-color: #120c1f;
            --panel-bg: #1f1435;
            --text-color: #f3e8ff;
            --accent-color: #e67e22;
            --accent-hover: #d35400;
            --border-color: #3b285c;
            --box-shadow: 0 4px 20px rgba(230, 126, 34, 0.3);
        }
        body.theme-cadilar .mesaj-kutusu { background: #2a1b48; color: #fff; border-left-color: #e67e22; }
        body.theme-cadilar input, body.theme-cadilar select { background: #120c1f; color: #fff; border-color: #3b285c; }

        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text-color); padding: 15px; margin: 0; box-sizing: border-box; transition: background 0.3s ease; }
        .container { max-width: 450px; width: 100%; margin: auto; }

        /* Toast (Sağ Üst Bildirim) Tasarımı */
        #toastContainer { position: fixed; top: 15px; right: 15px; z-index: 99999; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
        .toast { background: #222; color: white; padding: 12px 18px; border-radius: 6px; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.25); opacity: 0; transform: translateY(-15px); transition: all 0.3s ease; pointer-events: auto; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: #ff4d4d; }
        .toast.success { background: #27ae60; }

        /* Tema Test Barı */
        .theme-selector-panel { background: var(--panel-bg); padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: var(--box-shadow); display: flex; align-items: center; justify-content: space-between; font-size: 13px; border: 1px solid var(--border-color); }
        .theme-selector-panel select { width: 140px; margin: 0; padding: 6px; }

        /* Liste Alanları & Boş Durum Tasarımı */
        #dataList, #msgList { margin-bottom: 20px; max-height: 300px; overflow-y: auto; }
        .empty-state { text-align: center; padding: 25px 15px; background: var(--panel-bg); border-radius: 8px; color: #888; font-size: 13px; border: 2px dashed var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.02); display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .empty-state svg { width: 28px; height: 28px; fill: #cbd5e1; }

        .mesaj-kutusu { background: var(--panel-bg); color: var(--text-color); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid var(--accent-color); display: flex; align-items: center; gap: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .mesaj-kutusu.bot-mesaj { background: #f2e8f8; border-left-color: #d048f6; color: #111; }
        .mesaj-kutusu img { width: 30px; flex-shrink: 0; }
        .info { flex: 1; font-size: 14px; line-height: 1.6; word-break: break-all; }
        .del-btn { flex-shrink: 0; width: 50px; background: #ff4d4d; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        .panel { background: var(--panel-bg); color: var(--text-color); padding: 15px; border-radius: 12px; box-shadow: var(--box-shadow); margin-bottom: 20px; position: relative; border: 1px solid var(--border-color); }
        .logo-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .platform-btn { flex: 1; padding: 10px; border: 2px solid var(--border-color); border-radius: 8px; cursor: pointer; text-align: center; transition: 0.3s; }
        .platform-btn img { width: 24px; vertical-align: middle; }
        .platform-btn.active { border-color: var(--accent-color); background: rgba(92, 103, 242, 0.1); }

        .input-row { display: flex; gap: 5px; flex-wrap: wrap; }
        .input-row input { flex: 1; min-width: 120px; }
        .input-row select { width: auto; flex-shrink: 0; }

        input, select { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid var(--border-color); border-radius: 6px; box-sizing: border-box; font-size: 14px; background: var(--panel-bg); color: var(--text-color); }

        .btn-container { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
        .btn-container button { flex: 1; min-width: 90px; padding: 10px 6px; font-size: 12px; white-space: nowrap; }

        button { padding: 12px; background: var(--accent-color); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: var(--accent-hover); }
        .multi-btn { background: #27ae60; }
        .multi-btn:hover { background: #219653; }
        .chat-input { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 5px; margin-top: 10px; }
        .chat-input input { margin: 0; }

        /* Sağ üst küçük sembol buton */
        .settings-toggle-btn {
            background: linear-gradient(135deg, #ffffff, #f7f9fa);
            border: 1px solid #e1e8ed;
            color: #111;
            width: 36px;
            aspect-ratio: 1/1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            z-index: 10;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            transition: all 0.2s ease;
            position: relative;
        }
        .settings-toggle-btn:hover {
            background-color: #f7f7fd;
            transform: scale(1.02);
            box-shadow: 0 3px 8px rgba(0,0,0,0.09);
        }

        /* SVG */
        .bot-svg {
            width: 22px;
            height: 22px;
            fill: #111111;
            transition: transform 0.3s ease;
            position: relative;
            z-index: 5;
        }

        .radar-dot {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            display: none;
            z-index: 3;
        }

        /* --- 1. UYUYOR --- */
        .state-uyuyor .q-left_eye,
        .state-uyuyor .q-right_eye { display: none; }
        .state-uyuyor .bot-svg {
            fill: #111111;
            animation: sweet-sleep 3.5s infinite ease-in-out;
        }
        .zzz-container {
            position: absolute;
            top: -24px;
            right: 4px;
            pointer-events: none;
            display: none;
            z-index: 4;
        }
        .state-uyuyor .zzz-container { display: block; }
        .zzz {
            position: absolute;
            color: #8e44ad;
            font-weight: bold;
            font-size: 11px;
            opacity: 0;
            animation: rise-zzz 2.2s infinite linear;
        }
        .zzz:nth-child(2) { animation-delay: 0.7s; font-size: 13px; right: 6px; }
        .zzz:nth-child(3) { animation-delay: 1.4s; font-size: 15px; right: 12px; }

        @keyframes rise-zzz {
            0% { transform: translate(0, 0) scale(0.6); opacity: 0; }
            35% { opacity: 1; }
            100% { transform: translate(12px, -22px) scale(1.3); opacity: 0; }
        }
        @keyframes sweet-sleep {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(3px) scale(0.96) rotate(-3deg); }
        }

        /* --- 2. BEKLİYOR --- */
        .state-bekliyor .q-left_eye,
        .state-bekliyor .q-right_eye { display: block; }
        .state-bekliyor .bot-svg {
            fill: #111;
            animation: cute-bounce 1.4s infinite cubic-bezier(0.28, 0.84, 0.42, 1);
        }
        .popup-bubble {
            position: absolute;
            top: -38px;
            right: -10px;
            background: #000000;
            color: #ffffff;
            padding: 4px 9px;
            font-size: 10px;
            font-weight: 600;
            border-radius: 6px;
            white-space: nowrap;
            pointer-events: none;
            display: block;
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            animation: pop-up-anim 2.8s ease-in-out infinite;
            z-index: 5;
        }

        @keyframes pop-up-anim {
            0%, 100% { transform: translateY(6px) scale(0.7); opacity: 0; }
            15%, 85% { transform: translateY(0px) scale(1); opacity: 1; }
            95% { transform: translateY(-5px) scale(0.85); opacity: 0; }
        }
        @keyframes cute-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            40% { transform: translateY(-4px) scale(1.03); }
            70% { transform: translateY(0) scale(0.98); }
        }

        /* --- 3. ÇALIŞIYOR --- */
        .state-calisiyor .q-left_eye,
        .state-calisiyor .q-right_eye { display: block; }
        .state-calisiyor .bot-svg {
            fill: url(#purpleGradient);
            animation: happy-pulse 0.6s infinite alternate ease-in-out;
        }
        .state-calisiyor .radar-dot {
            display: block;
            background: url(#purpleGradient);
            background-color: #8e44ad;
            box-shadow: 0 0 6px rgba(142, 68, 173, 0.9);
            animation: blink-dot 0.5s infinite alternate;
        }
        @keyframes happy-pulse {
            0% { transform: scale(0.94) rotate(-2deg); }
            100% { transform: scale(1.06) rotate(2deg); }
        }
        @keyframes blink-dot {
            0% { opacity: 0.3; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        /* Çalışıyor - post resmi popup (sol, aşağıdan yukarıya hafif animasyon - konuşma balonu şeklinde) */
        .work-image-popup {
            position: absolute;
            bottom: 100%;
            left: -14px;
            margin-bottom: 6px;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            overflow: visible;
            z-index: 8;
            display: none;
            transform-origin: bottom right;
        }
        .work-image-popup .work-image-popup-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1.5px solid #ffffff;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.22);
            background: #fff;
        }
        .work-image-popup img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        /* Konuşma balonu sivri ucu - bota bakan taraf */
        .work-image-popup::after {
            content: '';
            position: absolute;
            bottom: -6px;
            right: 5px;
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 5px solid transparent;
            border-top: 7px solid #ffffff;
            filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.12));
        }
        .work-image-popup.show {
            display: block;
            animation: work-popup-rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards,
            work-popup-float 2.8s ease-in-out 0.85s infinite;
        }
        .work-image-popup.hide {
            display: block;
            animation: work-popup-fade 0.7s cubic-bezier(0.55, 0, 0.85, 0.35) forwards;
        }
        @keyframes work-popup-rise {
            0% { opacity: 0; transform: translateY(10px) scale(0.5); }
            65% { opacity: 1; transform: translateY(-1.5px) scale(1.02); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes work-popup-float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-2.5px) scale(1); }
        }
        @keyframes work-popup-fade {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-8px) scale(0.45); }
        }

        /* Çalışıyor - platform logosu zzz tarzı minik minik saçılsın (post görünümü değil) */
        .work-logo-scatter {
            position: absolute;
            top: -26px;
            right: -18px;
            width: 44px;
            height: 44px;
            pointer-events: none;
            display: none;
            z-index: 8;
        }
        .state-calisiyor .work-logo-scatter.active { display: block; }
        .work-logo-particle {
            position: absolute;
            border-radius: 5px;
            overflow: hidden;
            opacity: 0;
            border: 1.2px solid #ffffff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.25);
            animation: rise-logo-particle 2.4s infinite ease-out;
        }
        .work-logo-particle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .work-logo-particle:nth-child(1) { width: 10px; height: 10px; right: 0px;  bottom: 2px; animation-delay: 0s; }
        .work-logo-particle:nth-child(2) { width: 13px; height: 13px; right: 10px; bottom: 0px; animation-delay: 0.5s; }
        .work-logo-particle:nth-child(3) { width: 11px; height: 11px; right: 20px; bottom: 3px; animation-delay: 1s; }
        .work-logo-particle:nth-child(4) { width: 15px; height: 15px; right: 4px;  bottom: 4px; animation-delay: 1.5s; }
        .work-logo-particle:nth-child(5) { width: 12px; height: 12px; right: 16px; bottom: 1px; animation-delay: 2s; }

        @keyframes rise-logo-particle {
            0% { transform: translate(0, 0) scale(0.5) rotate(-8deg); opacity: 0; }
            30% { opacity: 1; }
            100% { transform: translate(14px, -30px) scale(1.15) rotate(8deg); opacity: 0; }
        }

        /* --- 4. DONDU --- */
        .state-dondu {
            background: linear-gradient(135deg, rgba(135, 206, 250, 0.8), rgba(30, 144, 255, 0.6)) !important;
            border: 1px solid rgba(255, 255, 255, 0.9) !important;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.9), 0 0 12px rgba(0, 191, 255, 0.5) !important;
            filter: blur(0.2px);
        }
        .state-dondu::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(225, 245, 254, 0.3);
            z-index: 1;
            border-radius: 13px;
        }
        .state-dondu .bot-svg {
            fill: #ffffff !important;
            filter: drop-shadow(0 0 3px rgba(0, 180, 216, 0.9));
            animation: none !important;
            transform: none !important;
            z-index: 5;
        }

        .snow-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            z-index: 2;
            overflow: hidden;
            border-radius: 14px;
        }
        .state-dondu .snow-container { display: block; }
        .snowflake {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            animation: fall-snow 1.5s infinite linear;
            box-shadow: 0 0 3px rgba(255, 255, 255, 0.9);
        }
        .snowflake:nth-child(1) { width: 3px; height: 3px; left: 10px; animation-duration: 1.1s; animation-delay: 0.2s; }
        .snowflake:nth-child(2) { width: 4px; height: 4px; left: 25px; animation-duration: 1.4s; animation-delay: 0.5s; }
        .snowflake:nth-child(3) { width: 2.5px; height: 2.5px; left: 45px; animation-duration: 0.9s; animation-delay: 0.1s; }
        .snowflake:nth-child(4) { width: 3.5px; height: 3.5px; left: 30px; animation-duration: 1.6s; animation-delay: 0.8s; }

        @keyframes fall-snow {
            0% { transform: translateY(-5px); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 0.9; }
            100% { transform: translateY(64px); opacity: 0; }
        }

        /* --- 5. ISINMA --- */
        .state-isinma {
            background: linear-gradient(135deg, #fff1f2, #ffe4e6) !important;
            border: 1px solid #fb7185 !important;
            box-shadow: inset 0 0 10px rgba(244, 63, 94, 0.2), 0 4px 15px rgba(244, 63, 94, 0.25) !important;
        }
        .state-isinma .q-left_eye,
        .state-isinma .q-right_eye { display: block; }
        .state-isinma .bot-svg {
            fill: #e11d48 !important;
            animation: heat-pulse 0.8s infinite alternate ease-in-out;
        }
        .heat-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            z-index: 2;
            overflow: hidden;
            border-radius: 14px;
        }
        .state-isinma .heat-container { display: block; }
        .heat-wave {
            position: absolute;
            background: rgba(255, 87, 87, 0.35);
            border-radius: 50%;
            filter: blur(4px);
            animation: rise-heat 1.6s infinite ease-out;
        }
        .heat-wave:nth-child(1) { width: 14px; height: 14px; left: 20px; bottom: 10px; animation-delay: 0s; }
        .heat-wave:nth-child(2) { width: 18px; height: 18px; right: 22px; bottom: 8px; animation-delay: 0.6s; }

        @keyframes rise-heat {
            0% { transform: translateY(0) scale(0.6); opacity: 0.8; }
            100% { transform: translateY(-40px) scale(1.6); opacity: 0; }
        }
        @keyframes heat-pulse {
            0% { transform: scale(0.97); }
            100% { transform: scale(1.03) rotate(1deg); }
        }
        .hot-badge{display: none}
        .state-isinma .hot-badge {
            display: flex;
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e11d48;
            color: #fff;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 6;
        }

        /* --- 6. KOD HATASI --- */
        .state-hata {
            background: #030712 !important;
            border: 1px solid #064e3b !important;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.4) !important;
        }
        .matrix-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            display: none;
            z-index: 2;
            overflow: hidden;
            border-radius: 13px;
            opacity: 0.7;
        }
        .state-hata .matrix-container { display: flex; justify-content: flex-start; align-items: flex-start; }
        .terminal-stream {
            position: absolute;
            top: 0;
            width: 100%;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            font-size: 5px;
            line-height: 7px;
            animation: full-terminal-scroll 1.8s infinite linear;
        }
        .state-hata .q-left_eye,
        .state-hata .q-right_eye { display: block; }
        .state-hata .bot-svg {
            fill: #00ff41 !important;
            filter: drop-shadow(0 0 5px rgba(0, 255, 65, 0.9));
            animation: glitch-anim 0.4s infinite alternate ease-in-out;
            z-index: 5;
        }

        @keyframes full-terminal-scroll {
            0% { transform: translateY(-50%); }
            100% { transform: translateY(0%); }
        }
        @keyframes glitch-anim {
            0% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(-1px, 1px) scale(1.02); }
            40% { transform: translate(1px, -1px) scale(0.98); }
            60% { transform: translate(-1px, -1px) scale(1.01); }
            80% { transform: translate(1px, 1px) scale(0.99); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* --- 7. İNTERNET KOPMASI --- */
        .state-kopuk {
            background: linear-gradient(135deg, #fff5f5, #fed7d7) !important;
            border: 1px solid #feb2b2 !important;
        }
        .state-kopuk .q-left_eye,
        .state-kopuk .q-right_eye { display: block; }
        .state-kopuk .bot-svg {
            fill: #e53e3e !important;
            animation: signal-shake 0.8s infinite ease-in-out;
        }
        .signal-container{display: none}
        .state-kopuk .signal-container {
            position: absolute;
            top: -12px;
            right: 0;
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            pointer-events: none;
            z-index: 6;
        }
        .signal-bar {
            width: 2.5px;
            background-color: #cbd5e1;
            border-radius: 2px;
            animation: signal-fade 1.2s infinite alternate ease-in-out;
        }
        .signal-bar:nth-child(1) { height: 3px; animation-delay: 0.1s; }
        .signal-bar:nth-child(2) { height: 6px; animation-delay: 0.2s; }
        .signal-bar:nth-child(3) { height: 9px; animation-delay: 0.3s; }
        .signal-bar:nth-child(4) { height: 11px; animation-delay: 0.4s; }
        .signal-bar:nth-child(5) { height: 14px; animation-delay: 0.5s; }

        @keyframes signal-fade {
            0%, 100% { opacity: 0.3; background-color: #cbd5e1; }
            50% { opacity: 0.9; background-color: #e53e3e; }
        }
        @keyframes signal-shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-1px) rotate(-1deg); }
            75% { transform: translateX(1px) rotate(1deg); }
        }

        /* --- 8. SÜRELİ BEKLEME --- */
        .state-sleep {
            background: linear-gradient(135deg, #f5f3ff, #ede9fe) !important;
            border: 1px solid #a78bfa !important;
            box-shadow: inset 0 0 10px rgba(124, 58, 237, 0.15), 0 4px 15px rgba(124, 58, 237, 0.25) !important;
        }
        .state-sleep .q-left_eye,
        .state-sleep .q-right_eye { display: block; }
        .state-sleep .bot-svg {
            fill: #7c3aed !important;
            filter: drop-shadow(0 0 2px rgba(124, 58, 237, 0.4));
            animation: sureli-nefes 1.6s infinite alternate ease-in-out;
        }
        @keyframes sureli-nefes {
            0% { transform: scale(0.97) rotate(-1deg); }
            100% { transform: scale(1.03) rotate(1deg); }
        }

        /* Dairesel geri sayım halkası — kesintisiz, tek akışlı animasyon */
        @property --progress {
            syntax: '<number>';
            inherits: false;
            initial-value: 100;
        }
        .progress-ring {
            position: absolute;
            inset: -5px;
            border-radius: 12px;
            padding: 1.5px;
            background: conic-gradient(#7c3aed calc(var(--progress) * 1%), rgba(124, 58, 237, 0.15) 0%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            display: none;
            z-index: 6;
            pointer-events: none;
        }
        .state-sleep .progress-ring { display: block; }
        @keyframes ring-deplete {
            from { --progress: 100; }
            to { --progress: 0; }
        }

        /* Arka plan parlama — badge ile uyumlu çok tonlu geçiş */
        .state-sleep::before {
            content: '';
            position: absolute;
            inset: -7px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, rgba(139, 92, 246, 0.28) 40%, rgba(192, 38, 211, 0.14) 68%, transparent 85%);
            z-index: 0;
            border-radius: 20px;
            filter: blur(5px);
            animation: purple-glow-pulse 2s infinite ease-in-out;
        }
        @keyframes purple-glow-pulse {
            0%, 100% { opacity: 0.55; transform: scale(0.94); }
            50% { opacity: 1; transform: scale(1.07); }
        }

        /* Alt kısımda minimal geri sayım rozeti */
        .timer-badge {
            position: absolute;
            bottom: -16px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 26px;
            height: 16px;
            padding: 0 4px;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 3px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6 55%, #c026d3);
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 7px;
            font-weight: 700;
            border-radius: 7px;
            border: 1.2px solid #ffffff;
            box-shadow: 0 2px 6px rgba(124, 58, 237, 0.5);
            z-index: 7;
            animation: timer-badge-pop 0.3s ease-out;
            letter-spacing: 0.2px;
            white-space: nowrap;
        }
        .state-sleep .timer-badge { display: flex; }
        @keyframes timer-badge-pop {
            0% { transform: translateX(-50%) translateY(6px) scale(0.6); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; }
        }

        /* Rozetin içindeki mini saat ikonu (sayının solunda) */
        .badge-clock {
            position: relative;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            border: 1px solid #ffffff;
            flex-shrink: 0;
        }
        .badge-clock-hand {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 1px;
            height: 2.8px;
            background: #ffffff;
            border-radius: 1px;
            transform-origin: bottom center;
            transform: translate(-50%, -100%) rotate(0deg);
            animation: badge-clock-tick 1.6s infinite linear;
        }
        @keyframes badge-clock-tick {
            0% { transform: translate(-50%, -100%) rotate(0deg); }
            100% { transform: translate(-50%, -100%) rotate(360deg); }
        }
        .badge-timer-text {
            display: inline-flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 3px;
        }

        /* --- 9. ŞARJ DURUMU --- */
        .state-charging {
            background: linear-gradient(135deg, #fffbeb, #fef3c7) !important;
            border: 1px solid #eab308 !important;
            box-shadow: inset 0 0 10px rgba(234, 179, 8, 0.15), 0 4px 15px rgba(234, 179, 8, 0.25) !important;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .state-charging.state-charging {
            background: linear-gradient(135deg, #f0fdf4, #dcfce7) !important;
            border: 1px solid #22c55e !important;
            box-shadow: inset 0 0 10px rgba(34, 197, 94, 0.15), 0 4px 15px rgba(34, 197, 94, 0.25) !important;
        }
        .state-charging .q-left_eye,
        .state-charging .q-right_eye { display: block; }
        .state-charging .bot-svg {
            fill: #eab308 !important;
            filter: drop-shadow(0 0 3px rgba(234, 179, 8, 0.5));
            animation: battery-idle-pulse 2.4s infinite ease-in-out;
            transition: fill 0.5s ease, filter 0.5s ease;
        }
        .state-charging.state-charging .bot-svg {
            fill: #22c55e !important;
            filter: drop-shadow(0 0 4px rgba(34, 197, 94, 0.6));
        }
        @keyframes battery-idle-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .battery-gauge {
            position: absolute;
            top: -5px;
            right: -5px;
            width: 10px;
            height: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid #eab308;
            border-radius: 50%;
            background: #fffbeb;
            box-shadow: 0 2px 6px rgba(234, 179, 8, 0.35);
            overflow: hidden;
            z-index: 6;
            transition: border-color 0.5s ease, box-shadow 0.5s ease, background 0.5s ease;
        }
        .state-charging .battery-gauge {
            display: flex;
            border-color: #22c55e;
            background: #f0fdf4;
            box-shadow: 0 2px 6px rgba(34, 197, 94, 0.4);
        }

        .battery-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 0%;
            background: linear-gradient(180deg, #facc15, #eab308);
            transition: height 0.7s ease, background 0.5s ease;
            z-index: 1;
        }
        .state-charging.state-charging .battery-fill {
            background: linear-gradient(180deg, #4ade80, #16a34a);
        }

        .battery-bolt-icon {
            position: relative;
            width: 12px;
            height: 12px;
            fill: #eab308;
            filter: drop-shadow(0 0 2px rgba(234, 179, 8, 0.6));
            z-index: 2;
            transition: fill 0.4s ease, filter 0.4s ease;
        }
        .state-charging.state-charging .battery-bolt-icon {
            fill: #ffffff;
            filter: drop-shadow(0 0 3px rgba(34, 197, 94, 0.9));
            animation: bolt-flicker 1.4s infinite ease-in-out;
        }
        @keyframes bolt-flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.55; }
        }

        /* --- 10. BAN (LIT_BAN) --- */
        .state-ban {
            background: linear-gradient(135deg, #f2e4d3, #d9b98c) !important;
            border: 1px solid #8b5a2b !important;
            box-shadow: inset 0 0 10px rgba(139, 90, 43, 0.3), 0 4px 15px rgba(139, 90, 43, 0.35) !important;
            filter: none;
            transition: background 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .state-ban .q-left_eye,
        .state-ban .q-right_eye { display: block; }
        .state-ban .bot-svg {
            fill: #6b4423 !important;
            filter: drop-shadow(0 0 3px rgba(107, 68, 35, 0.7));
            animation: ban-pulse 1.4s infinite ease-in-out;
        }
        @keyframes ban-pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04) rotate(-1deg); }
        }

        /* Ban - kaka emojisi (sağ üst köşede, ısı rozeti gibi) */
        .ban-emoji-popup {
            position: absolute;
            top: -7px;
            right: -7px;
            font-size: 14px;
            line-height: 1;
            opacity: 0;
            pointer-events: none;
            z-index: 8;
            display: none;
            filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25));
            transform-origin: center;
        }
        .ban-emoji-popup.show {
            display: block;
            animation: ban-emoji-rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards,
            ban-emoji-float 2.8s ease-in-out 0.85s infinite;
        }
        .ban-emoji-popup.hide {
            display: block;
            animation: ban-emoji-fade 0.7s cubic-bezier(0.55, 0, 0.85, 0.35) forwards;
        }
        @keyframes ban-emoji-rise {
            0% { opacity: 0; transform: scale(0.4) rotate(-10deg); }
            65% { opacity: 1; transform: scale(1.08) rotate(3deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        @keyframes ban-emoji-float {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.05) rotate(-2deg); }
        }
        @keyframes ban-emoji-fade {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(0.4) rotate(10deg); }
        }

    const secondsValue = botBtn.querySelector('.sleep-seconds-value');
    const progressRing = botBtn.querySelector('.progress-ring');
    let countdownInterval = null;

    function startSureliBekleme(totalSeconds) {
        if (countdownInterval) clearInterval(countdownInterval);
        let remaining = totalSeconds;

        progressRing.style.animation = 'none';
        void progressRing.offsetWidth;
        progressRing.style.animation = `ring-deplete ${totalSeconds}s linear forwards`;

        botBtn.classList.add('state-sleep');
        secondsValue.textContent = remaining;

        countdownInterval = setInterval(() => {
            remaining--;
            if (remaining <= 0) {
                clearInterval(countdownInterval);
                countdownInterval = null;
                botBtn.classList.remove('state-sleep');
                progressRing.style.animation = '';
                return;
            }
            secondsValue.textContent = remaining;
        }, 1000);
    }

    function findPlatformInLog(logText) {
        const lowerLog = String(logText).toLowerCase();
        for (const key in settingsPlatforms) {
            const platform = settingsPlatforms[key];
            if (!platform.active) continue;
            const name = key.slice(1);
            if (lowerLog.includes(name.toLowerCase())) {
                return platform;
            }
        }
        return null;
    }

    const BAN_SOUND_POOL_SIZE = 4;

    const banSoundPool = Array.from({ length: BAN_SOUND_POOL_SIZE }, () => {
        const a = new Audio();
        a.preload = 'auto';
        a.volume = BAN_SOUND_VOLUME;
        return a;
    });
    let banSoundPoolIndex = 0;

    function unlockAudio() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        banSoundPool.forEach(a => {
            a.src = BAN_SOUND_URLS[Math.floor(Math.random() * BAN_SOUND_URLS.length)];
            a.volume = 0;
            const p = a.play();
            if (p && typeof p.then === 'function') {
                p.then(() => {
                    a.pause();
                    a.currentTime = 0;
                    a.volume = BAN_SOUND_VOLUME;
                }).catch(() => {
                    a.volume = BAN_SOUND_VOLUME;
                    audioUnlocked = false;
                });
            } else {
                a.volume = BAN_SOUND_VOLUME;
            }
        });
    }
    ['click', 'touchstart', 'keydown'].forEach(evt => {
        document.addEventListener(evt, unlockAudio, { passive: true });
    });

    function playBanSound() {
        const sound = banSoundPool[banSoundPoolIndex];
        banSoundPoolIndex = (banSoundPoolIndex + 1) % banSoundPool.length;

        const randomUrl = BAN_SOUND_URLS[Math.floor(Math.random() * BAN_SOUND_URLS.length)];

        try {
            sound.pause();
            sound.currentTime = 0;
            sound.src = randomUrl;
        } catch (e) {}

        const p = sound.play();
        if (p && typeof p.catch === 'function') {
            p.catch(() => {
                unlockAudio();
                const retry = () => {
                    sound.currentTime = 0;
                    sound.play().catch(() => {});
                };
                document.addEventListener('click', retry, { once: true });
                document.addEventListener('touchstart', retry, { once: true });
                document.addEventListener('keydown', retry, { once: true });
            });
        }
    }

    function updateBotIconState(action) {
        const act = String(action || 'uyuyor').toLowerCase();

        if (banInProgress && !act.includes('ban')) {
            queuedActionAfterBan = act;
            return;
        }

        if (act === lastAppliedStateKey) return;
        lastAppliedStateKey = act;

        clearAllBotStates();

        if (act.includes('sleep')) {
            const sleepMatch = act.match(/sleep-?(\d+)/);
            const totalDuration = sleepMatch ? parseInt(sleepMatch[1], 10) : 60;
            const sleepInfoRef = ref(db, 'suarez/sleepInfo');

            // Transaction: birden fazla kullanıcı aynı anda tetiklese bile
            // sadece TEK bir başlangıç zamanı kaydedilir, herkes ona göre hesaplar.
            runTransaction(sleepInfoRef, (info) => {
                if (info && info.key === act && info.end) {
                    return info; // Aynı sleep turu devam ediyor, dokunma
                }
                // Yeni sleep turu - SUNUCU saatine göre bitiş zamanı belirle
                return { key: act, end: getServerNow() + totalDuration * 1000 };
            }).then((result) => {
                const info = result.snapshot.val();
                const remainingMs = info.end - getServerNow();
                const seconds = remainingMs > 0 ? Math.ceil(remainingMs / 1000) : 0;
                startSureliBekleme(seconds);
            });
        } else if (act.includes('ban')) {
            triggerBan();

            botBtn.classList.add('state-charging');

        let lastWaitingIndex = -1;
        sortedKeys.forEach((key, idx) => {
            const entry = initialVal[key];
            const text = typeof entry === 'string' ? entry : JSON.stringify(entry);
            if (/Sunucudan hesap bekleniyor/i.test(text)) {
                lastWaitingIndex = idx;
            }
        });

        // O mesajdan itibaren (dahil) tüm logları baştan işleyip mevcut durumu (uygulama/post) yeniden kur
        if (lastWaitingIndex !== -1) {
            for (let i = lastWaitingIndex; i < sortedKeys.length; i++) {
                processLogEntry(initialVal[sortedKeys[i]]);
            }
        }

        const lastKnownLogKey = sortedKeys.length ? sortedKeys[sortedKeys.length - 1] : null;

        // Sayfa açık kaldığı sürece yeni gelen logları canlı işlemeye devam et
        onChildAdded(logsRef, (snapshot) => {

    function cleanText(str) {
        if (!str) return "";
        let cleaned = '';
        const homoglifMap = {
            'а': 'a', 'е': 'e', 'о': 'o', 'с': 'c', 'р': 'p', 'х': 'x', 'у': 'y', 'і': 'i', 'ѕ': 's',
            'А': 'A', 'В': 'B', 'Е': 'E', 'К': 'K', 'М': 'M', 'Н': 'H', 'О': 'O', 'Р': 'P', 'С': 'C', 'Т': 'T', 'Х': 'X'
        };
        for (let i = 0; i < str.length; i++) {
            let c = str[i];
            cleaned += homoglifMap[c] || c;
        }
        return cleaned.replace(/[\u200B\u200C\u200D\uFEFF\uFE00-\uFE0F]/g, '');
    }

    function updatePreviews(val) {
        const cleaned = cleanText(val);
        rawPreview.textContent = cleaned || "-";
        parsedPreview.textContent = val ? val.split('').map(c => /[аеосрхуіѕАВЕКМНОНРСТХ\u200B\u200C\u200D\uFEFF\uFE00-\uFE0F]/.test(c) ? '🎅' : c).join('') : "-";
    }

    onValue(generalRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            isRemoteUpdate = true;
            if (data.name !== undefined) nameInput.value = data.name;
            if (data.text !== undefined) {
                textInput.value = data.text;
                cleanTextValue = cleanText(data.text);
                updatePreviews(data.text);
            }
            if (data.vpn !== undefined) vpnToggle.checked = data.vpn;
            isRemoteUpdate = false;
        }
    });

    function updateDatabase() {
        if (isRemoteUpdate) return;

        set(generalRef, {
            name: nameInput.value,
            text: textInput.value,
            vpn: vpnToggle.checked
        }).then(() => {
            statusText.textContent = "Kaydedildi";
            setTimeout(() => statusText.textContent = "Bağlandı", 1000);
        });
    }

    nameInput.addEventListener('input', updateDatabase);
    textInput.addEventListener('input', (e) => {
        cleanTextValue = cleanText(e.target.value);
        updatePreviews(e.target.value);
        updateDatabase();
    });

        ];

        const randomStyle = creativeStyles[Math.floor(Math.random() * creativeStyles.length)];

    glitchBtn.addEventListener('click', () => {
        let val = cleanTextValue || cleanText(textInput.value);
        if (!val) return;

        const homoglifs = {
            'a': 'а', 'e': 'е', 'o': 'о', 'c': 'с', 'p': 'р', 'x': 'х', 'y': 'у', 'i': 'і', 's': 'ѕ',
            'A': 'А', 'B': 'В', 'E': 'Е', 'K': 'К', 'M': 'М', 'H': 'Н', 'O': 'О', 'P': 'Р', 'C': 'С', 'T': 'Т', 'X': 'Х'
        };
        const variationSelectors = ['\uFE00', '\uFE01', '\uFE02', '\uFE0E', '\uFE0F'];

        let glitchedVal = '';
        for (let i = 0; i < val.length; i++) {
            let char = val[i];
            if (homoglifs[char] && Math.random() > 0.3) {
                glitchedVal += homoglifs[char];
            } else {
                glitchedVal += char;
            }
            if (Math.random() > 0.4) {
                glitchedVal += variationSelectors[Math.floor(Math.random() * variationSelectors.length)];
            }
        }

        textInput.value = glitchedVal;
        updatePreviews(glitchedVal);
        updateDatabase();
    });
